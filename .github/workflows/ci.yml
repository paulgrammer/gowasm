name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same branch supersedes this run.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, and build every example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The generated packages are TypeScript compiled and tested with Node, and
      # `go test` for js/wasm runs its binaries under Node as well.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Lint, unit tests, the runtime bridge under the real wasm_exec.js, and
      # every example built and tested end to end.
      - name: Verify
        run: make verify

      # Regenerating must produce no diff. This catches a generator change that
      # was never re-run against the examples, which would otherwise only show
      # up as a confusing failure in someone else's build.
      - name: Check generated output is current
        run: make check-generated

      - name: Cross-compile every release platform
        run: make cross

      # Builds the npm distribution and drives the launcher through the
      # node_modules layout npm produces, so a broken launcher or manifest is
      # caught here rather than after a release has gone out.
      #
      # Deliberately not `npm install` of the launcher: its optional
      # dependencies resolve against the registry, which does not have these
      # versions until the publish workflow runs, so npm would prune the
      # platform package and the test would fail for a reason unrelated to the
      # code being tested.
      - name: Build and smoke-test the npm packages
        run: |
          make npm-packages
          for f in dist/npm/*/package.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || exit 1
          done
          # Every package must produce a valid tarball.
          for d in dist/npm/*/; do ( cd "$d" && npm pack --silent >/dev/null ); done

          work=$(mktemp -d)
          mkdir -p "$work/node_modules"
          cp -R dist/npm/gowasm "$work/node_modules/gowasm"
          cp -R dist/npm/gowasm-linux-amd64 "$work/node_modules/gowasm-linux-amd64"
          node "$work/node_modules/gowasm/bin/gowasm.js" -version
          node "$work/node_modules/gowasm/bin/gowasm.js" doctor
