name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same branch supersedes this run.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, and build every example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The generated packages are TypeScript compiled and tested with Node, and
      # `go test` for js/wasm runs its binaries under Node as well.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Lint, unit tests, the runtime bridge under the real wasm_exec.js, and
      # every example built and tested end to end.
      - name: Verify
        run: make verify

      # Regenerating must produce no diff. This catches a generator change that
      # was never re-run against the examples, which would otherwise only show
      # up as a confusing failure in someone else's build.
      - name: Check generated output is current
        run: make check-generated

      - name: Cross-compile every release platform
        run: make cross

      # Builds the npm distribution and drives the launcher through the
      # node_modules layout npm produces, so a broken launcher or manifest is
      # caught here rather than after a release has gone out.
      #
      # Deliberately not `npm install` of the launcher: its optional
      # dependencies resolve against the registry, so this would test whatever
      # is published rather than what was just built.
      #
      # Nothing here hardcodes the package name or the platform. The launcher is
      # scoped, which nests it a directory deeper, and renaming it again should
      # not require editing this.
      - name: Build and smoke-test the npm packages
        run: |
          make npm-packages

          find dist/npm -maxdepth 3 -name package.json -print0 | while IFS= read -r -d '' f; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f"
            ( cd "$(dirname "$f")" && npm pack --silent >/dev/null )
          done

          launcher=$(dirname "$(dirname "$(find dist/npm -path '*/bin/gowasm.js' | head -1)")")
          name=$(node -p "require('./$launcher/package.json').name")
          platform=$(node -p "({darwin:'darwin',linux:'linux',win32:'windows'})[process.platform]+'-'+({x64:'amd64',arm64:'arm64'})[process.arch]")

          work=$(mktemp -d)
          mkdir -p "$work/node_modules/$(dirname "$name")"
          cp -R "$launcher" "$work/node_modules/$name"
          cp -R "dist/npm/gowasm-$platform" "$work/node_modules/gowasm-$platform"

          echo "launcher: $name (platform package gowasm-$platform)"
          node "$work/node_modules/$name/bin/gowasm.js" -version
          node "$work/node_modules/$name/bin/gowasm.js" doctor
